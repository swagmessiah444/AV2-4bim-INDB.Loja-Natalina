<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contato - Natal Gamer</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/produtos.js" defer></script>
  <script src="js/script.js" defer></script>
</head>
<body>
<header class="topo">
  <a class="logo" href="index.html">
    <img src="img/image.jpg" alt="Natal Gamer" class="logo-img">
    <span>Natal Gamer</span>
  </a>
  <nav>
    <a href="index.html">Home</a>
    <a href="produtos.html">Produtos</a>
    <a href="ofertas.html">Ofertas</a>
    <a href="contato.html">Contato</a>
    <a href="carrinho.html">Carrinho <span id="contador-carrinho">0</span></a>
    <button id="botao-neve">Neve</button>
  </nav>
</header>
<main>
  <h1>Fale com papai noel gamer (real)</h1>
  <form id="form-contato">
    <label for="nome">Nome</label>
    <input type="text" id="nome">
    <span class="erro" id="erro-nome"></span>

    <label for="email">E-mail</label>
    <input type="text" id="email">
    <span class="erro" id="erro-email"></span>

    <label for="mensagem">Mensagem</label>
    <textarea id="mensagem" rows="5"></textarea>
    <span class="erro" id="erro-mensagem"></span>

    <button type="submit">Enviar mensagem</button>
    <p class="sucesso" id="sucesso"></p>
  </form>
</main>
<footer><p>Natal Gamer - Jogos e equipamentos em um preço razoavel #confia</p>
</footer>
</body>
</html>
